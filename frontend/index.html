    // SECTION: page state. Current language, month order, and counters to ignore late (stale) answers.
    const MONTH_ORDER = [4, 5, 0, 1, 2, 3];   // Demo months first, then training months.
    const TRAINING_MONTHS = [0, 1, 2, 3];
    let lang = "en";
    let me = null;                            // GET /auth/me: who is signed in (null while signed out).
    let requestCounter = 0;                   // Forecast requests.
    const counters = { summary: 0, savings: 0, whatif: 0, results: 0, budgets: 0, live: 0, evidence: 0, details: 0 };   // One counter per new section.
    let lastBudgets = null;                   // Last budget answer, redrawn when the language changes.
    // The 7 transaction types the live form offers (same order as the API's list).
    const LIVE_TYPES = ["merchant_payment", "bill_payment", "mobile_recharge", "send_money_family", "cash_out",
      "salary_or_income", "add_money"];
    const BUDGET_TYPES = ["merchant_payment", "bill_payment", "mobile_recharge", "send_money_family", "cash_out"];
    let resultsData = null;                   // GET /results, kept in memory after the first successful load.
    let lastForecast = null;                  // Kept so the chart text can be redrawn without a new request.
    let lastSavingsBody = null;               // Last savings request, re-sent when the language changes.
    // What-if state: which user-month it belongs to, the API's day-20 balance, whether the slider was moved.
    let wi = { key: null, start: null, touched: false, lastOverrides: null };

    // SECTION: what-if inputs. The 10 optional keys with the contract's limits (balance_day20 is the slider).
    const WHATIF_FIELDS = [
      { key: "min_balance_d1_20", max: 500000, whole: false },
      { key: "avg_daily_spend_d1_20", max: 500000, whole: false },
      { key: "total_inflow_d1_20", max: 500000, whole: false },
      { key: "total_outflow_d1_20", max: 500000, whole: false },
      { key: "cashout_count_d1_20", max: 500000, whole: true },
      { key: "cashout_amount_d1_20", max: 500000, whole: false },
      { key: "days_since_last_inflow", max: 20, whole: true },
      { key: "bill_payments_d1_20", max: 500000, whole: true },
      { key: "prev_month_shortfall", max: 1, whole: true },
      { key: "inflow_vs_prev_month", max: 500000, whole: false }
    ];

    // SECTION: small helpers. Look up an element, make an element with text, format numbers.
    const $ = (id) => document.getElementById(id);
    const S = () => STRINGS[lang];
    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;   // textContent only: API text is never treated as HTML.
      return node;
    }
    // Formats a number exactly as given (no rounding of whole numbers) in Bangla or English digits.
    // An optional language (the English-only results tab passes "en"); the default is the page language.
    function num(n, inLang = lang) {
      return new Intl.NumberFormat(inLang === "bn" ? "bn-BD" : "en-US", { maximumFractionDigits: 20 }).format(n);
    }
    const taka = (n, inLang = lang) => "৳" + num(n, inLang);
    // Metric formatters for the results tab: 3 fixed decimals, and an explicit sign for differences.
    const fixed3 = (x) => Number(x).toFixed(3);
    const signed3 = (x) => (x > 0 ? "+" : "") + Number(x).toFixed(3);
    const selectedUser = () => $("user-select").value;
    const selectedMonth = () => $("month-select").value;

    // SECTION: status messages (loading, error, clear).
    function showStatus(text, isError) {
      $("status").textContent = text;
      $("status").classList.toggle("error", !!isError);
    }
    // Builds a short friendly message from the API's error JSON; never shows raw text.
    // A 401 means the session ended (signed out elsewhere or expired): show the sign-in screen.
    async function errorMessage(response) {
      if (response.status === 401 && me) showSignedOut();
      try {
        const body = await response.json();
        const msg = lang === "bn" ? body.error_bn : body.error;
        if (typeof msg === "string" && msg) return msg;
      } catch (_ignored) { /* Not JSON: fall through to the generic message. */ }
      return S().errorFallback;
    }

    // SECTION: request helper for the new sections. Returns { data } or { msg }, or null when a newer
    // request for the same section has started (the late answer is ignored).
    // An optional method (PUT, DELETE) overrides the default: POST with a body, GET without.
    async function fetchJson(section, url, body, method) {
      const mine = ++counters[section];
      const current = () => mine === counters[section];
      try {
        const options = { method: method || (body ? "POST" : "GET") };
        if (body) { options.headers = { "Content-Type": "application/json" }; options.body = JSON.stringify(body); }
        const response = await fetch(url, options);
        if (!current()) return null;
        if (!response.ok) {
          const msg = await errorMessage(response);
          return current() ? { msg } : null;
        }
        const data = await response.json();
        return current() ? { data } : null;
      } catch (_e) {
        return current() ? { msg: S().errorFallback } : null;
      }
    }

    // SECTION: fixed labels. Fills every element marked data-s="key" (and data-f="field") from STRINGS.
    function applyStrings() {
      document.documentElement.lang = lang;
      document.querySelectorAll("[data-s]").forEach((node) => { node.textContent = S()[node.dataset.s]; });
      document.querySelectorAll("[data-f]").forEach((node) => { node.textContent = S().fields[node.dataset.f]; });
      $("lang-group").setAttribute("aria-label", S().langGroup);
      $("lang-en").setAttribute("aria-pressed", String(lang === "en"));
      $("lang-bn").setAttribute("aria-pressed", String(lang === "bn"));
      if (me) $("who").textContent = S().signedInAs(me.username, S().roles[me.role] || me.role);
      // Live form types, budget field labels and the data notice follow the language.
      for (const opt of $("lv-type").options) opt.textContent = S().types[opt.value];
      document.querySelectorAll("[data-type]").forEach((node) => { node.textContent = S().types[node.dataset.type]; });
      if (me && me.consent) {
        $("consent-text").textContent = me.consent.notice[lang];
        $("consent-version").textContent = S().consentVersion(me.consent.notice_version);
      }
      if (lastBudgets) renderBudgets(lastBudgets);
      $("safe-list").replaceChildren(...S().safe.map((t) => el("li", "", t)));
      // Relabel dropdown options in the chosen language (values stay the same).
      for (const opt of $("user-select").options) opt.textContent = S().userN(num(Number(opt.value)));
      for (const opt of $("month-select").options) {
        const m = Number(opt.value);
        opt.textContent = S().monthN(num(m)) + " (" + (TRAINING_MONTHS.includes(m) ? S().monthTraining : S().monthTest) + ")";
      }
      showSliderValues();
    }

    // SECTION: month dropdown. Months 4 and 5 first, then 0-3.
    function buildMonths() {
      for (const m of MONTH_ORDER) {
        const opt = document.createElement("option");
        opt.value = String(m);
        $("month-select").appendChild(opt);
      }
      $("month-select").value = "4";
    }

    // SECTION: what-if fields. One blank number input per optional key; labels come from STRINGS.
    function buildWhatifFields() {
      for (const f of WHATIF_FIELDS) {
        const label = el("label", "field");
        const caption = el("span");
        caption.dataset.f = f.key;
        const input = el("input");
        input.type = "number"; input.id = "wi-" + f.key; input.min = "0"; input.max = String(f.max);
        input.step = f.whole ? "1" : "any";
        input.inputMode = f.whole ? "numeric" : "decimal";
        label.append(caption, input);
        $("wi-fields").appendChild(label);
      }
    }

    // SECTION: user dropdown. Filled from GET /users; first user is the default.
    async function loadUsers() {
      showStatus(S().loading);
      try {
        const response = await fetch("/users");
        if (!response.ok) { showStatus(await errorMessage(response), true); return false; }
        const users = await response.json();
        for (const u of users) {
          const opt = document.createElement("option");
          opt.value = String(u.user_id);
          $("user-select").appendChild(opt);
        }
        if (users.length) return true;
        showStatus(S().noUser, true);                          // A customer account with no linked user.
        return false;
      } catch (_e) { /* Network or format problem: show the generic message below. */ }
      showStatus(S().errorFallback, true);
      return false;
    }

    // SECTION: forecast request. Only the newest request may update the page.
    async function loadForecast() {
      const myRequest = ++requestCounter;
      const userId = selectedUser();
      const month = selectedMonth();
      showStatus(S().loading);
      $("cards").setAttribute("aria-busy", "true");
      try {
        const response = await fetch("/users/" + encodeURIComponent(userId) + "/months/" +
          encodeURIComponent(month) + "/forecast?lang=" + lang);
        if (myRequest !== requestCounter) return;               // A newer request has started: ignore this one.
        if (!response.ok) {
          const msg = await errorMessage(response);
          if (myRequest !== requestCounter) return;
          showStatus(msg, true);
          $("cards").hidden = true; $("footer").hidden = true;
          return;
        }
        const data = await response.json();
        if (myRequest !== requestCounter) return;
        lastForecast = data;
        render(data);
        showStatus("");
      } catch (_e) {
        if (myRequest !== requestCounter) return;
        showStatus(S().errorFallback, true);
        $("cards").hidden = true; $("footer").hidden = true;
      } finally {
        if (myRequest === requestCounter) $("cards").removeAttribute("aria-busy");
      }
    }

    // SECTION: render. Puts one forecast on the page. Shows numbers exactly as the API sent them.
    function render(d) {
      renderRisk(d);
      renderChart(d);
      renderReasons(d);
      renderSuggestions(d);
      setupWhatif(d);
      $("training").hidden = !d.month_in_training;
      $("disclaimer").textContent = d.disclaimer;
      $("live-card").hidden = !canWrite();
      $("cards").hidden = false;
      $("footer").hidden = false;
    }

    // SECTION: risk card. Band chip, the API's sentence, and the estimated minimum when present.
    function renderRisk(d) {
      const chip = $("risk-chip");
      chip.className = "chip " + d.risk_band;
      // Numbered band: "Level 2 · Medium risk" (the level comes from the API; never a probability).
      chip.textContent = (d.level ? S().levelN(num(d.level)) + " · " : "") + (S().band[d.risk_band] || d.risk_band);
      $("risk-text").textContent = d.risk_band_text;
      const min = d.predicted_min_balance;
      $("min-balance").hidden = !min;
      if (min) $("min-balance").textContent = S().minBalance(taka(min.amount_bdt), taka(min.typical_error_bdt));
      // Staff see whether this is a linked customer or an unlinked simulated fixture.
      const subject = me && me.role !== "customer" && d.data_subject ? S().subject[d.data_subject] : "";
      $("subject-line").textContent = subject || "";
      $("subject-line").hidden = !subject;
    }

    // SECTION: chart. Inline SVG: balance line days 1-20, dashed floor, shaded days 21-30, axis labels.
    const SVG_NS = "http://www.w3.org/2000/svg";
    function svg(tag, attrs, text) {
      const node = document.createElementNS(SVG_NS, tag);
      for (const k in attrs) node.setAttribute(k, attrs[k]);
      if (text !== undefined) node.textContent = text;
      return node;
    }
    function renderChart(d) {
      const W = 360, H = 210, L = 8, R = 8, T = 16, B = 26;    // Size and margins in drawing units.
      const points = d.balance_by_day || [];
      const values = points.map((p) => p.balance_bdt).concat([d.floor_bdt]);
      const top = Math.max(...values, 1) * 1.15;                // Headroom above the highest value (drawing only).
      const bottom = Math.min(0, ...values);
      const x = (day) => L + (day - 1) / 29 * (W - L - R);
      const y = (v) => T + (top - v) / (top - bottom) * (H - T - B);

      const day20 = points.find((p) => p.day === 20);
      const root = svg("svg", { viewBox: "0 0 " + W + " " + H, role: "img", "aria-labelledby": "chart-alt-t chart-alt-d" });
      root.appendChild(svg("title", { id: "chart-alt-t" }, S().chartTitle));
      root.appendChild(svg("desc", { id: "chart-alt-d" },
        S().chartAlt(day20 ? taka(day20.balance_bdt) : "-", taka(d.floor_bdt))));

      // Shaded area for days 21-30 with its label.
      root.appendChild(svg("rect", { x: x(20), y: T, width: x(30) - x(20), height: H - T - B, fill: "var(--chart-unknown)" }));
      root.appendChild(svg("text", { x: (x(20) + x(30)) / 2, y: T + 18, "text-anchor": "middle", class: "axis-text" }, S().notKnown));

      // Where the two value labels go: the end-point label sits right of the last dot (below the
      // "not known yet" label); the floor label sits at the right end of its line, above it unless
      // that would crowd the top or the end-point label, then below it.
      const last = points.length ? points[points.length - 1] : null;
      const endY = last ? Math.min(H - B - 4, Math.max(T + 36, y(last.balance_bdt) + 4)) : null;
      const fy = y(d.floor_bdt);
      let floorY = fy - 5 < T + 34 ? fy + 14 : fy - 5;
      if (endY !== null && Math.abs(floorY - endY) < 14) floorY = floorY === fy - 5 ? fy + 14 : fy - 5;

      // Dashed floor line with its label at the right end, away from the balance line.
      root.appendChild(svg("line", { x1: L, x2: W - R, y1: fy, y2: fy,
        stroke: "var(--chart-floor)", "stroke-width": 1.5, "stroke-dasharray": "5 4" }));
      root.appendChild(svg("text", { x: W - R - 2, y: floorY, "text-anchor": "end", class: "floor-text halo" },
        S().floor(taka(d.floor_bdt))));

      // Balance line for days 1-20, with a dot and the API's balance on the last day.
      if (last) {
        root.appendChild(svg("polyline", { points: points.map((p) => x(p.day) + "," + y(p.balance_bdt)).join(" "),
          fill: "none", stroke: "var(--chart-line)", "stroke-width": 2.5, "stroke-linejoin": "round" }));
        root.appendChild(svg("circle", { cx: x(last.day), cy: y(last.balance_bdt), r: 4, fill: "var(--chart-line)" }));
        root.appendChild(svg("text", { x: x(last.day) + 7, y: endY, class: "end-text halo" }, taka(last.balance_bdt)));
      }

      // Baseline and day labels at 1, 10 and 20.
      root.appendChild(svg("line", { x1: L, x2: W - R, y1: H - B, y2: H - B, stroke: "var(--line)" }));
      for (const day of [1, 10, 20]) {
        const anchor = day === 1 ? "start" : "middle";
        root.appendChild(svg("text", { x: x(day), y: H - 8, "text-anchor": anchor, class: "axis-text" }, S().day(num(day))));
      }
      $("chart").replaceChildren(root);
    }

    // SECTION: reasons. API text with a neutral up or down arrow.
    function renderReasons(d) {
      const list = $("reasons");
      list.replaceChildren();
      for (const r of d.reasons || []) {
        const li = el("li");
        const arrow = el("span", "arrow", r.direction === "up" ? "↑" : "↓");
        arrow.setAttribute("role", "img");
        arrow.setAttribute("aria-label", r.direction === "up" ? S().up : S().down);
        const body = el("span");
        // Risk factor code, rank, direction and strength (from the API) above the reason sentence.
        if (r.code) body.append(el("span", "soft", S().reasonMeta(r.code, r.factor_name, num(r.rank), S().effect[r.effect], num(r.strength))), el("br"));
        body.append(el("span", "", r.text));
        li.append(arrow, body);
        list.appendChild(li);
      }
    }

    // SECTION: suggestions and notes. Shortfall warning first, then buffer, cash-out saver, savings note.
    function renderSuggestions(d) {
      const box = $("suggestions");
      box.replaceChildren();
      const sugg = (type) => (d.suggestions || []).find((s) => s.type === type);
      const note = (type) => (d.notes || []).find((n) => n.type === type);
      const addNote = (type) => {
        const n = note(type);
        if (n) { const card = el("div", "card note"); card.appendChild(el("p", "", n.text)); box.appendChild(card); }
      };

      // Shortfall warning above the suggestion cards.
      addNote("shortfall_warning");
      // Buffer card: big amount, then its text.
      const buffer = sugg("buffer");
      if (buffer) {
        const card = el("div", "card");
        card.append(el("span", "tag", S().tag), " ", el("span", "tag", S().fromRule), el("h2", "", S().bufferTitle),
          el("div", "big-amount", taka(buffer.amount_bdt)), el("p", "", buffer.text),
          feedbackRow("buffer", "helpful"), feedbackRow("buffer", "keep"));
        box.appendChild(card);
      }
      // Model-driven target balance, labelled as coming from the model, next to the rule-based buffer.
      const target = d.model_target;
      if (target) {
        const card = el("div", "card");
        card.append(el("span", "tag", S().tag), " ", el("span", "tag", S().fromModel), el("h2", "", S().targetTitle),
          el("div", "big-amount", taka(target.amount_bdt)), el("p", "", target.text),
          feedbackRow("model_target_balance", "helpful"));
        box.appendChild(card);
      }
      // Cash-out saver card: its text, plus the English fee-rate label in the English view only
      // (the Bangla text already says it).
      const cashout = sugg("cashout_saver");
      if (cashout) {
        const card = el("div", "card");
        card.append(el("span", "tag", S().tag), el("h2", "", S().cashoutTitle), el("p", "", cashout.text));
        if (lang === "en") card.appendChild(el("p", "fee-label", cashout.fee_rate_label));
        card.appendChild(feedbackRow("cashout_saver", "helpful"));
        box.appendChild(card);
      }
      // Savings-blocked note after the suggestions.
      addNote("savings_blocked_alert");
      // Clear card when there is an alert but no buffer.
      const noBuffer = note("no_buffer_low_balance");
      if (d.alert && !buffer && noBuffer) {
        const card = el("div", "card note clear");
        card.append(el("h2", "", S().noBufferTitle), el("p", "", noBuffer.text));
        box.appendChild(card);
      }
      $("sugg-section").hidden = box.children.length === 0;
    }

    // SECTION: feedback buttons under a suggestion (customers only). Two answers; the reply replaces them.
    function feedbackRow(type, question) {
      const row = el("div", "result");
      if (!me || me.role !== "customer") return row;            // Staff do not answer for customers.
      const q = question === "keep" ? [S().fbKeep, S().fbKeepYes, S().fbKeepNo] : [S().fbHelpful, S().fbHelpfulYes, S().fbHelpfulNo];
      const buttons = el("div", "customer-actions");
      for (const [answer, label] of [["yes", q[1]], ["no", q[2]]]) {
        const b = el("button", "btn small", label);
        b.type = "button";
        b.addEventListener("click", async () => {
          const section = "fb-" + type + "-" + question;        // Own counter per question row.
          counters[section] = counters[section] || 0;
          const r = await fetchJson(section, "/feedback", { suggestion_type: type, question, answer });
          if (r) row.replaceChildren(el("p", r.msg ? "form-error" : "soft", r.msg || S().fbThanks));
        });
        buttons.appendChild(b);
      }
      row.append(el("p", "soft", q[0]), buttons);
      return row;
    }

    // SECTION: month summary. Bars for categories and weeks; widths are scaled to the largest amount
    // in each list for display only, and every number shown is the API's.
    // The optional fmt formats each amount; the default (taka) keeps the month-summary bars as they were.
    function bars(list, items, fmt = taka) {
      const most = Math.max(0, ...items.map((i) => i.amount));
      list.replaceChildren(...items.map((i) => {
        const li = el("li");
        const row = el("div", "bar-row");
        row.append(el("span", "", i.label), el("span", "bar-amount", fmt(i.amount)));
        const track = el("div", "bar-track");
        track.setAttribute("aria-hidden", "true");
        const fill = el("div", "bar-fill");
        fill.style.width = (most > 0 ? Math.max(0, i.amount) / most * 100 : 0) + "%";
        track.appendChild(fill);
        li.append(row, track);
        return li;
      }));
    }
    async function loadSummary() {
      const msg = $("summary-msg");
      msg.className = "msg soft";
      msg.textContent = S().loading;
      const r = await fetchJson("summary", "/users/" + encodeURIComponent(selectedUser()) + "/months/" +
        encodeURIComponent(selectedMonth()) + "/summary?lang=" + lang);
      if (!r) return;                                           // A newer summary request is running.
      if (r.msg) { msg.className = "msg form-error"; msg.textContent = r.msg; $("summary-body").hidden = true; return; }
      const d = r.data;
      bars($("sum-cat"), (d.by_category || []).map((c) => ({ label: c.label, amount: c.amount_bdt })));
      bars($("sum-week"), (d.by_week || []).map((w) => ({ label: S().week(num(w.start_day), num(w.end_day)), amount: w.amount_bdt })));
      $("sum-text").textContent = d.text;
      msg.textContent = "";
      $("summary-body").hidden = false;
    }

    // SECTION: savings planner. Checks the inputs, sends the plan request, shows the API's answer.
    // Plan numbers and options appear only for feasible / not_feasible and only when the API sends them.
    function wholeIn(input, lo, hi) {
      const raw = input.value.trim();
      const n = Number(raw);
      return raw !== "" && Number.isInteger(n) && n >= lo && n <= hi ? n : null;
    }
    function showSavingsMessage(text) {
      counters.savings++;                                       // Any answer still on its way is now stale.
      lastSavingsBody = null;
      $("savings-out").replaceChildren(el("p", "form-error", text));
    }
    async function sendSavings(body) {
      lastSavingsBody = body;
      const out = $("savings-out");
      out.replaceChildren(el("p", "soft", S().loading));
      const r = await fetchJson("savings", "/savings-plan", Object.assign({}, body, { lang }));
      if (!r) return;
      if (r.msg) { out.replaceChildren(el("p", "form-error", r.msg)); return; }
      const d = r.data;
      const parts = [el("p", "", d.text)];
      const plan = (d.status === "feasible" || d.status === "not_feasible") ? d.plan : null;
      if (plan) {
        const list = el("ul");
        list.appendChild(el("li", "", S().planMonthly(taka(plan.monthly_bdt))));
        if (plan.reaches_goal) list.appendChild(el("li", "", S().planMonths(num(plan.months))));
        if (plan.saved_in_max_months_bdt != null) {
          list.appendChild(el("li", "", S().planSavedMax(taka(plan.saved_in_max_months_bdt), num(plan.months))));
        }
        parts.push(list);
        if (Array.isArray(d.options) && d.options.length) {
          const options = el("ul");
          for (const o of d.options) options.appendChild(el("li", "", o.text));
          parts.push(el("h3", "", S().optionsTitle), options);
        }
      }
      if (d.disclaimer) parts.push(el("p", "soft", d.disclaimer));
      out.replaceChildren(...parts);
    }
    $("savings-form").addEventListener("submit", (event) => {
      event.preventDefault();
      const goal = wholeIn($("sv-goal"), 1, 500000);
      const months = wholeIn($("sv-months"), 1, 24);
      if (goal === null) { showSavingsMessage(S().goalInvalid); return; }
      if (months === null) { showSavingsMessage(S().monthsInvalid); return; }
      sendSavings({ user_id: Number(selectedUser()), month: Number(selectedMonth()), goal_bdt: goal, months });
    });

    // SECTION: what-if slider. Starts at the forecast's last balance_by_day point. The range is display
    // scaling only; until the slider is moved the API's own number is shown and nothing is sent for it.
    const sliderValue = () => (wi.touched ? Number($("wi-balance").value) : wi.start);
    function showSliderValues() {
      const ready = wi.start !== null;
      $("wi-now").textContent = ready ? S().sliderNow(taka(sliderValue())) : "";
      $("wi-start").textContent = ready ? S().sliderStart(taka(wi.start)) : "";
      if (ready) $("wi-balance").setAttribute("aria-valuetext", taka(sliderValue()));
    }
    function setupWhatif(d) {
      const key = selectedUser() + "/" + selectedMonth();
      if (key === wi.key) { showSliderValues(); return; }      // Same user-month (language change): keep the user's edits.
      const points = d.balance_by_day || [];
      const start = points.length ? points[points.length - 1].balance_bdt : null;
      wi = { key, start, touched: false, lastOverrides: null };
      const slider = $("wi-balance");
      if (start !== null) {
        slider.max = String(Math.min(500000, Math.max(Math.ceil(start * 2), 10000)));
        slider.value = String(start);
      }
      slider.disabled = start === null;
      $("wi-reset").disabled = start === null;
      $("wi-send").disabled = false;
      showSliderValues();
    }
    $("wi-balance").addEventListener("input", () => { wi.touched = true; showSliderValues(); });
    $("wi-balance").addEventListener("change", tryWhatif);     // Sent on release, not on every drag step.
    $("wi-reset").addEventListener("click", () => {
      wi.touched = false;
      $("wi-balance").value = String(wi.start);
      showSliderValues();
    });

    // SECTION: what-if request. Collects only the keys the user changed, checks them, then sends.
    function collectOverrides() {
      const overrides = {};
      if (wi.touched && wi.start !== null && sliderValue() !== wi.start) overrides.balance_day20 = sliderValue();
      for (const f of WHATIF_FIELDS) {
        const input = $("wi-" + f.key);
        const raw = input.value.trim();
        if (raw === "" && !input.validity.badInput) continue;  // Left blank: not sent.
        const n = Number(raw);
        if (raw === "" || !Number.isFinite(n) || n < 0 || n > f.max || (f.whole && !Number.isInteger(n))) {
          return { error: S().fieldInvalid(S().fields[f.key]) };
        }
        overrides[f.key] = n;
      }
      return { overrides };
    }
    function showWhatifMessage(text) {
      counters.whatif++;                                        // Any answer still on its way is now stale.
      wi.lastOverrides = null;
      $("wi-out").replaceChildren(el("p", "form-error", text));
    }
    function tryWhatif() {
      if (wi.key === null) return;                             // No forecast for this user-month yet.
      const c = collectOverrides();
      if (c.error) { showWhatifMessage(c.error); return; }
      if (!Object.keys(c.overrides).length) { showWhatifMessage(S().nothingChanged); return; }
      sendWhatif(c.overrides);
    }
    async function sendWhatif(overrides) {
      wi.lastOverrides = overrides;
      const out = $("wi-out");
      out.replaceChildren(el("p", "soft", S().loading));
      const r = await fetchJson("whatif", "/whatif",
        { user_id: Number(selectedUser()), month: Number(selectedMonth()), overrides, lang });
      if (!r) return;
      if (r.msg) { out.replaceChildren(el("p", "form-error", r.msg)); return; }
      const d = r.data;
      // Original and new band side by side. Bands only, never a probability.
      const side = (caption, band) => {
        const box = el("div");
        box.append(el("span", "soft", caption), el("span", "chip " + band, S().band[band] || band));
        return box;
      };
      const arrow = el("span", "soft", "→");
      arrow.setAttribute("aria-hidden", "true");
      const compare = el("div", "compare");
      compare.append(side(S().compareBefore, (d.original || {}).risk_band), arrow, side(S().compareAfter, (d.whatif || {}).risk_band));
      out.replaceChildren(compare, el("p", "", d.risk_change_text), el("p", "soft", d.note));
    }
    $("wi-form").addEventListener("submit", (event) => { event.preventDefault(); tryWhatif(); });

    // SECTION: results tab helpers. A card with a heading, and a real table (row headers, column headers)
    // inside a scrolling box so it never widens the page.
    function resultsCard(title, ...children) {
      const card = el("section", "card");
      card.append(el("h2", "", title), ...children);
      return card;
    }
    function makeTable(caption, headers, rows) {
      const table = el("table");
      table.appendChild(el("caption", "", caption));
      const headRow = el("tr");
      headers.forEach((h, i) => { const th = el("th", i ? "num" : "", h); th.scope = "col"; headRow.appendChild(th); });
      table.appendChild(el("thead")).appendChild(headRow);
      const body = table.appendChild(el("tbody"));
      for (const r of rows) {
        const tr = body.appendChild(el("tr"));
        r.forEach((c, i) => {
          const cell = el(i ? "td" : "th", i ? "num" : "", c);
          if (!i) cell.scope = "row";
          tr.appendChild(cell);
        });
      }
      const wrap = el("div", "table-wrap");
      wrap.appendChild(table);
      return wrap;
    }
    function plainList(items) {
      const list = el("ul", "plain-list");
      for (const item of items) list.appendChild(typeof item === "string" ? el("li", "", item) : item);
      return list;
    }

    // SECTION: results tab render. Every number comes from GET /results; the only arithmetic is the
    // model-minus-rule difference of two served values and the "interval includes zero" test.
    function renderResults(d) {
      const R = STRINGS.results;
      const en = (x) => num(x, "en");
      const m = d.metrics, v2 = m.view2_not_below_day20, ci = m.bootstrap_95ci, mae = m.min_balance_mae_bdt;
      const lead = m.lead_time_days, sanity = m.sanity;
      const includesZero = (range) => range[0] <= 0 && 0 <= range[1];
      const prDiff = v2.model.pr_auc - v2.rule.pr_auc;
      const recDiff = v2.equal_volume.model_recall - v2.equal_volume.rule_recall;
      const prCi = ci.view2_pr_auc_diff, recCi = ci.view2_equal_volume_recall_diff;
      const leadLine = (name, diff, range) => R.lead(name, signed3(diff), signed3(range[0]), signed3(range[1]), includesZero(range), diff > 0);

      // 1. Honest summary: six statements.
      const ruleItem = el("li");
      ruleItem.append(el("span", "", R.ruleStrong), plainList([leadLine(R.prName, prDiff, prCi), leadLine(R.recallName, recDiff, recCi)]));
      const addsItem = el("li");
      addsItem.append(el("span", "", R.addsTitle), plainList([
        R.addMae(taka(mae.model_all, "en"), taka(mae.naive_all, "en")),
        R.addReason,
        R.addDirection(fixed3(sanity.direction_share_up)),
        R.addFairness,
        R.addLeak(fixed3(sanity.shuffled_label_test_roc_auc), fixed3(sanity.holdout_users_view2_pr_auc),
          fixed3(sanity.main_model_same_users_view2_pr_auc))
      ]));
      const cards = [resultsCard(R.honestTitle, plainList([
        R.simulated, ruleItem, addsItem,
        R.timing(en(lead.n), en(lead.median), en(lead.mean)),
        R.bufferRule + " " + R.feePlaceholder(en(d.impact.fee_rate_pct)),
        R.decide
      ]))];

      // 2. View 2 table: each method's served values, then the difference and the bootstrap intervals.
      cards.push(resultsCard(R.tableTitle, makeTable(R.caption(d.impact.months.map(en).join(", ")),
        [R.colMethod, R.prName, R.recallName], [
          [R.rowModel, fixed3(v2.model.pr_auc), fixed3(v2.equal_volume.model_recall)],
          [R.rowRule, fixed3(v2.rule.pr_auc), fixed3(v2.equal_volume.rule_recall)],
          [R.rowPersistence, fixed3(v2.persistence.pr_auc), R.notInArtifacts],
          [R.rowDiff, signed3(prDiff), signed3(recDiff)],
          [R.rowInterval, R.range(signed3(prCi[0]), signed3(prCi[1])), R.range(signed3(recCi[0]), signed3(recCi[1]))]
        ])));

      // 3. Minimum-balance estimate: model vs naive error as two bars.
      const maeBars = el("ul", "bars");
      bars(maeBars, [{ label: R.maeModel, amount: mae.model_all }, { label: R.maeNaive, amount: mae.naive_all }], (x) => taka(x, "en"));
      cards.push(resultsCard(R.maeTitle, maeBars));

      // 4. Global SHAP importance, top 8, with plain names (raw name when there is no label).
      const shap = Object.entries(d.shap_global.mean_abs_shap).sort((a, b) => b[1] - a[1]).slice(0, 8);
      const shapBars = el("ul", "bars");
      bars(shapBars, shap.map(([k, v]) => ({ label: R.featureNames[k] || STRINGS.en.fields[k] || k, amount: v })), fixed3);
      cards.push(resultsCard(R.shapTitle, el("p", "soft", R.shapNote), shapBars));

      // 4b. Risk factor register: all 11 codes with their global importance from shap_global.json.
      if (Array.isArray(d.risk_factors)) {
        cards.push(resultsCard(R.rfTitle, el("p", "soft", R.rfNote), makeTable(R.rfTitle, R.rfCols,
          d.risk_factors.map((f) => [f.code, f.name, fixed3(d.shap_global.mean_abs_shap[f.feature])]))));
      }

      // 5. Fairness: one table per column, exactly as the artifact has it, then what it supports.
      const fairParts = [];
      let groupCount = 0, lowCount = 0;
      for (const [attr, info] of Object.entries(d.fairness)) {
        const rows = Object.entries(info.groups).map(([g, x]) => {
          groupCount += 1;
          if (x.low_sample) lowCount += 1;
          return [g, en(x.rows), fixed3(x.shortfall_rate), fixed3(x.alert_rate), fixed3(x.recall), fixed3(x.fpr), x.low_sample ? R.yes : R.no];
        });
        fairParts.push(makeTable(R.attrNames[attr] || attr, R.fairCols, rows),
          el("p", "soft", R.gaps(fixed3(info.largest_gaps.recall), fixed3(info.largest_gaps.fpr))));
      }
      cards.push(resultsCard(R.fairTitle, ...fairParts, el("p", "", R.fairLine(en(groupCount), lowCount))));

      // 7 and 8. Impact card (added in its own section below), then the path to real data.
      const impact = impactCard(d.impact);
      if (impact) cards.push(impact);
      cards.push(resultsCard(R.pathTitle, plainList(R.path)));
      const evidence = el("section", "card");                   // Filled by loadEvidence; hidden without a file.
      evidence.id = "evidence-card";
      evidence.hidden = true;
      cards.push(evidence);
      const detailsBox = el("div", "cards");                    // Filled by loadDetails from GET /results/details.
      detailsBox.id = "details-box";
      detailsBox.style.padding = "0";
      cards.push(detailsBox);
      cards.push(el("p", "disclaimer", d.disclaimer));
      $("results-body").replaceChildren(...cards);
      loadEvidence();
      loadDetails();
    }
    // SECTION: model details and the load test. Everything is read from artifact files through the API;
    // a part whose file does not exist yet is left out.
    async function loadDetails() {
      const r = await fetchJson("details", "/results/details");
      const box = $("details-box");
      if (!r || !box || r.msg || !r.data) return;
      const R = STRINGS.results, d = r.data, en = (x) => num(x, "en");
      const rate = (x) => (x === null || x === undefined ? R.notAvailable : fixed3(x));
      const parts = [el("p", "soft", R.detailsNote),
        makeTable(R.inputsCaption, R.inputsCols, d.inputs.map((f) => [f.code, f.name])),
        el("p", "", R.split(d.split.train_months.join(", "), d.split.test_months.join(", "), en(d.split.out_of_fold_rows), d.split.how))];
      if (d.confusion) {
        for (const [view, c] of Object.entries(d.confusion)) {
          parts.push(makeTable(R.confusionCaption(R.viewNames[view] || view), R.confusionCols,
            [[R.alerted, en(c.tp), en(c.fp)], [R.notAlerted, en(c.fn), en(c.tn)]]));
        }
      }
      parts.push(makeTable(R.groupsCaption, R.groupsCols, d.groups.map((g) => [en(g.group), en(g.rows), rate(g.actual_shortfall_rate)])));
      const cards = [resultsCard(R.detailsTitle, ...parts)];
      const st = d.spending_types;
      cards.push(resultsCard(R.spendTitle, plainList([R.spendModel(st.model_everyday_spend.join(", ")),
        R.spendSummary(Object.entries(st.summary_categories).map(([t, c]) => t + " (" + c + ")").join(", ")),
        R.spendBudget(st.budget_types.join(", ")), R.spendLive(Object.keys(st.live_types).join(", "))])));
      if (d.anomaly) cards.push(resultsCard(R.anomalyTitle, plainList(R.anomalyLines(d.anomaly))));
      if (d.challenger && d.challenger.views) {
        const c = d.challenger, tables = [];
        for (const [view, v] of Object.entries(c.views)) {
          tables.push(makeTable(R.viewNames[view] || view, R.challengerCols, ["shipped", "challenger", "rule"].map((m) =>
            [R.methodNames[m], fixed3(v[m].pr_auc), fixed3(v[m].precision), fixed3(v[m].recall), fixed3(v[m].f1),
              fixed3(v.equal_volume[m + "_recall"])])));
        }
        const ci = Object.entries(c.bootstrap_95ci || {}).map(([k, x]) => R.ciLine(R.ciNames[k] || k, signed3(x[0]), signed3(x[1])));
        cards.push(resultsCard(R.challengerTitle, el("p", "", c.verdict_text), ...tables, plainList(ci)));
      }
      if (d.load_test) cards.push(resultsCard(R.loadTitle, plainList(R.loadLines(d.load_test))));
      box.replaceChildren(...cards);
    }
    // SECTION: user-research card. Shown only when docs/survey_results.json exists (GET /evidence answers 200).
    // Every number is the file's own; the page adds none.
    async function loadEvidence() {
      const r = await fetchJson("evidence", "/evidence");
      const card = $("evidence-card");
      if (!r || !card || r.msg || !r.data) return;
      const R = STRINGS.results, d = r.data;
      const parts = [el("h2", "", R.evidenceTitle), el("p", "soft", R.evidenceMeta(String(d.n), String(d.date), String(d.method)))];
      for (const q of d.questions || []) {
        parts.push(makeTable(String(q.text), R.evidenceCols, Object.entries(q.answers || {}).map(([a, n]) => [a, String(n)])));
      }
      card.replaceChildren(...parts);
      card.hidden = false;
    }
    // SECTION: impact card. Reads only the served impact field; no arithmetic. A missing or broken field
    // gives a one-line message instead of a blank card.
    function impactCard(m) {
      const R = STRINGS.results;
      const ok = m && ["alerted_user_months", "saver_shown_user_months", "fees_bdt"].every((k) => Number.isFinite(m[k]));
      if (!ok) return resultsCard(R.impactTitle, el("p", "soft", R.impactMissing));
      const avg = (x) => (Number.isFinite(x) ? taka(x, "en") : R.notAvailable);
      const months = Array.isArray(m.months) ? m.months.join(", ") : R.notAvailable;
      const lines = [
        R.impactAlerted(num(m.alerted_user_months, "en"), months),
        R.impactShown(num(m.saver_shown_user_months, "en")),
        R.impactFees(taka(m.fees_bdt, "en")),
        R.impactAvgAlerted(avg(m.avg_fees_per_alerted_bdt)),
        R.impactAvgShown(avg(m.avg_fees_per_saver_shown_bdt))
      ];
      if (Number.isFinite(m.fee_rate_pct)) lines.push(R.impactRate(num(m.fee_rate_pct, "en")));
      return resultsCard(R.impactTitle, plainList(lines),
        el("p", "soft", R.impactAssumption), el("p", "soft", R.impactPast));
    }

    // SECTION: results tab load. Fetched once, the first time the tab opens; a failure lets the next open retry.
    async function loadResults() {
      const msg = $("results-msg");
      msg.className = "msg soft";
      msg.textContent = STRINGS.results.loading;
      const r = await fetchJson("results", "/results");
      if (!r) return;                                           // A newer request is running.
      try {
        if (!r.data) throw new Error("no data");
        renderResults(r.data);
        resultsData = r.data;
        msg.textContent = "";
      } catch (_e) {
        msg.className = "msg form-error";
        msg.textContent = STRINGS.results.error;
      }
    }

    // SECTION: tabs. Shows one panel and hides the other; the wallet is never reloaded by switching.
    // Left and right arrow keys move between tabs.
    function showTab(name, focus) {
      for (const t of ["wallet", "results"]) {
        const on = t === name;
        $("tab-" + t).setAttribute("aria-selected", String(on));
        $("tab-" + t).tabIndex = on ? 0 : -1;
        $("panel-" + t).hidden = !on;
        if (on && focus) $("tab-" + t).focus();
      }
      if (name === "results" && !resultsData) loadResults();
    }
    $("tab-wallet").addEventListener("click", () => showTab("wallet"));
    $("tab-results").addEventListener("click", () => showTab("results"));
    $("tab-list").addEventListener("keydown", (event) => {
      if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
      showTab($("tab-wallet").getAttribute("aria-selected") === "true" ? "results" : "wallet", true);
    });

    // SECTION: reset on user or month change. Old answers are dropped and the what-if waits for the new forecast.
    function resetSections() {
      counters.savings++; counters.whatif++;
      lastSavingsBody = null;
      $("savings-out").replaceChildren();
      wi = { key: null, start: null, touched: false, lastOverrides: null };
      $("wi-balance").disabled = true; $("wi-reset").disabled = true; $("wi-send").disabled = true;
      $("wi-out").replaceChildren();
      for (const f of WHATIF_FIELDS) $("wi-" + f.key).value = "";
      counters.live++; counters.budgets++;
      $("live-out").replaceChildren();
      lastBudgets = null;
      $("budget-bars").replaceChildren();
      showSliderValues();
    }

    // SECTION: events. Dropdowns reload everything; the language toggle relabels and re-fetches.
    function onSelectionChange() { resetSections(); loadForecast(); loadSummary(); loadBudgets(); }
    $("user-select").addEventListener("change", onSelectionChange);
    $("month-select").addEventListener("change", onSelectionChange);
    document.querySelectorAll(".lang-toggle button").forEach((btn) => {
      btn.addEventListener("click", () => {
        if (btn.dataset.lang === lang) return;
        lang = btn.dataset.lang;
        applyStrings();
        if (!me || $("wallet-area").hidden) return;     // Signed out (or not yet in the wallet): labels only.
        if (lastForecast) renderChart(lastForecast);   // Chart labels follow the language at once.
        loadForecast();
        loadSummary();
        counters.live++; $("live-out").replaceChildren();   // The live result was in the old language.
        // Re-ask the planner and what-if in the new language; drop page messages in the old one.
        if (lastSavingsBody) sendSavings(lastSavingsBody); else { counters.savings++; $("savings-out").replaceChildren(); }
        if (wi.lastOverrides) sendWhatif(wi.lastOverrides); else { counters.whatif++; $("wi-out").replaceChildren(); }
      });
    });

    // SECTION: demo personas. Found by scan; the generator is deterministic. A click sets both dropdowns and
    // runs the same reload as a manual change; savings cases pre-fill the planner but do not send it.
    const PERSONAS = [
      { user: 1, month: 4 },                          // Alert, buffer capped by the day-20 balance.
      { user: 8, month: 4 },                          // Alert, full buffer.
      { user: 1, month: 5 },                          // Low risk, no alert.
      { user: 19, month: 4, goal: 10000, months: 6 }, // Savings plan "feasible".
      { user: 1, month: 0, goal: 10000, months: 6 },  // Savings "no_history".
      { user: 3, month: 4 }                           // High risk, alert, balance too low for a buffer.
    ];
    const personaButtons = document.querySelectorAll("[data-persona]");
    const clearPersona = () => personaButtons.forEach((b) => b.setAttribute("aria-pressed", "false"));
    personaButtons.forEach((btn) => {
      btn.addEventListener("click", () => {
        const p = PERSONAS[Number(btn.dataset.persona)];
        const userOk = [...$("user-select").options].some((o) => o.value === String(p.user));
        if (!userOk) return;                           // Users not loaded yet.
        $("user-select").value = String(p.user);
        $("month-select").value = String(p.month);
        clearPersona();
        btn.setAttribute("aria-pressed", "true");
        onSelectionChange();
        if (p.goal) { $("sv-goal").value = String(p.goal); $("sv-months").value = String(p.months); }
      });
    });
    $("user-select").addEventListener("change", clearPersona);    // A manual change clears the highlight.
    $("month-select").addEventListener("change", clearPersona);

    // SECTION: who may add live data and set budgets: a customer (own wallet) or an admin. Analysts only read.
    const canWrite = () => !!me && (me.role === "customer" || me.role === "admin");

    // SECTION: live form and budget fields. Built once; labels come from STRINGS in applyStrings.
    function buildLiveForm() {
      for (const t of LIVE_TYPES) { const opt = el("option"); opt.value = t; $("lv-type").appendChild(opt); }
      for (const t of BUDGET_TYPES) {
        const label = el("label", "field");
        const caption = el("span");
        caption.dataset.type = t;
        const input = el("input");
        input.type = "number"; input.id = "bg-" + t; input.min = "0"; input.max = "500000"; input.step = "1";
        input.inputMode = "numeric";
        label.append(caption, input);
        $("budget-fields").appendChild(label);
      }
    }

    // SECTION: budget bars. Spent so far against the monthly budget, a state word, and the day-30 pace line.
    // Bar widths are display scaling only; every amount shown is the API's.
    function renderBudgets(b) {
      const list = $("budget-bars");
      if (!b.enabled) { list.replaceChildren(); $("budget-msg").textContent = S().budgetOff; return; }
      $("budget-msg").textContent = "";
      list.replaceChildren(...b.bars.map((bar) => {
        const li = el("li");
        const row = el("div", "bar-row");
        row.append(el("span", "", S().types[bar.type]),
          el("span", "bar-amount", bar.budget_bdt ? S().budgetLine(taka(bar.spent_bdt), taka(bar.budget_bdt)) : S().budgetNone(taka(bar.spent_bdt))));
        const track = el("div", "bar-track");
        track.setAttribute("aria-hidden", "true");
        const fill = el("div", "bar-fill" + (bar.state === "close" || bar.state === "over" ? " " + bar.state : ""));
        fill.style.width = (bar.budget_bdt ? Math.min(1, bar.spent_bdt / bar.budget_bdt) * 100 : 0) + "%";
        track.appendChild(fill);
        const words = [S().budgetState[bar.state], bar.budget_source ? S().budgetSource[bar.budget_source] : "",
          S().budgetPace(taka(bar.pace_day30_bdt))].filter(Boolean).join(" · ");
        li.append(row, track, el("p", "bar-state", words));
        return li;
      }));
    }
    async function loadBudgets() {
      $("budget-own").hidden = !canWrite();
      const r = await fetchJson("budgets", "/users/" + encodeURIComponent(selectedUser()) + "/budgets?month=" +
        encodeURIComponent(selectedMonth()));
      if (!r) return;
      if (r.msg) { lastBudgets = null; $("budget-bars").replaceChildren(); $("budget-msg").textContent = r.msg; return; }
      lastBudgets = r.data;
      renderBudgets(r.data);
    }
    $("budget-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const body = {};
      for (const t of BUDGET_TYPES) {
        const raw = $("bg-" + t).value.trim();
        if (raw === "") continue;                               // Empty: leave this budget as it is.
        const n = Number(raw);
        if (!Number.isInteger(n) || n < 0 || n > 500000) { $("budget-msg").textContent = S().budgetInvalid; return; }
        body[t] = n === 0 ? null : n;                            // 0: back to the usual-month budget.
      }
      if (!Object.keys(body).length) return;
      const r = await fetchJson("budgets", "/users/" + encodeURIComponent(selectedUser()) + "/budgets",
        { budgets: body }, "PUT");
      if (!r) return;
      if (r.msg) { $("budget-msg").textContent = r.msg; return; }
      for (const t of BUDGET_TYPES) $("bg-" + t).value = "";
      await loadBudgets();
      $("budget-msg").textContent = S().budgetSaved;
    });

    // SECTION: live transaction. Checked in the page, sent with a fresh idempotency key, and the answer
    // redraws the band, reasons, chart, suggestions, budgets and the unusual note without a reload.
    function newKey() {
      return window.crypto && crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + "-" + Math.random();
    }
    $("live-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const day = wholeIn($("lv-day"), 1, 20);
      const amount = wholeIn($("lv-amount"), 1, 200000);
      const out = $("live-out");
      if (day === null) { out.replaceChildren(el("p", "form-error", S().liveDayInvalid)); return; }
      if (amount === null) { out.replaceChildren(el("p", "form-error", S().liveAmountInvalid)); return; }
      $("lv-send").disabled = true;
      out.replaceChildren(el("p", "soft", S().loading));
      const r = await fetchJson("live", "/live/transactions", { user_id: Number(selectedUser()),
        month: Number(selectedMonth()), day, type: $("lv-type").value, amount, idempotency_key: newKey(), lang });
      $("lv-send").disabled = false;
      if (!r) return;
      if (r.msg) { out.replaceChildren(el("p", "form-error", r.msg)); return; }
      const d = r.data;
      lastForecast = d.assessment;
      wi.key = null;                                            // The what-if starts again from the new balance.
      render(d.assessment);
      if (d.budgets) { lastBudgets = d.budgets; renderBudgets(d.budgets); }
      const parts = [el("p", "soft", S().liveScored(num(d.ms))),
        el("p", "", S().liveBand(S().band[d.changed.band_before], S().band[d.changed.band_after])),
        el("p", "", S().liveBalance(taka(d.changed.balance_day20_before), taka(d.changed.balance_day20_after)))];
      if (d.transaction.fee_bdt > 0) parts.push(el("p", "soft", S().liveFee(taka(d.transaction.fee_bdt))));
      if (d.unusual && d.unusual.enabled && d.unusual.text) {
        const note = el("div", "card note");
        note.append(el("h3", "", S().unusualTitle), el("p", "", d.unusual.text));
        parts.push(note);
      }
      out.replaceChildren(...parts);
      loadSummary();                                            // Spending by category changed too.
    });

    // SECTION: the customer's own controls. Reset live data; withdraw consent (back to the notice).
    $("live-reset").addEventListener("click", async () => {
      const r = await fetchJson("live", "/me/live", undefined, "DELETE");
      if (!r) return;
      $("customer-msg").textContent = r.msg || S().liveResetDone(num(r.data.deleted));
      $("live-out").replaceChildren();
      wi.key = null;
      loadForecast(); loadSummary(); loadBudgets();
    });
    $("consent-withdraw").addEventListener("click", async () => {
      const r = await fetchJson("live", "/me/consent/withdraw", {});
      if (!r) return;
      if (r.msg) { $("customer-msg").textContent = r.msg; return; }
      me = r.data;
      showWallet();
    });
    // "Download my data": the API's JSON saved as a file through a temporary in-page link.
    $("data-export").addEventListener("click", async () => {
      const r = await fetchJson("live", "/me/export");
      if (!r) return;
      if (r.msg) { $("customer-msg").textContent = r.msg; return; }
      const link = el("a");
      link.href = URL.createObjectURL(new Blob([JSON.stringify(r.data, null, 2)], { type: "application/json" }));
      link.download = "my-copilot-data.json";
      link.click();
      setTimeout(() => URL.revokeObjectURL(link.href), 1000);
    });
    // "Delete my live data and settings": asks first, then reloads the simulated month.
    $("data-delete").addEventListener("click", async () => {
      if (!window.confirm(S().deleteConfirm)) return;
      const r = await fetchJson("live", "/me/data", undefined, "DELETE");
      if (!r) return;
      $("customer-msg").textContent = r.msg || S().deleteDone;
      $("live-out").replaceChildren();
      wi.key = null;
      loadForecast(); loadSummary(); loadBudgets();
    });
    $("consent-accept").addEventListener("click", async () => {
      const r = await fetchJson("live", "/me/consent", { notice_version: me.consent.notice_version });
      if (!r) return;
      if (r.msg) { $("consent-msg").textContent = r.msg; return; }
      $("consent-msg").textContent = "";
      me = r.data;
      showWallet();
    });

    // SECTION: sign-in state. Signed out: only the sign-in card (the results tab stays public).
    function showSignedOut() {
      me = null;
      requestCounter++; counters.summary++;                    // Drop any answers still on their way.
      resetSections();
      lastForecast = null;
      $("user-select").replaceChildren();
      $("wallet-area").hidden = true;
      $("consent-area").hidden = true;
      $("session-row").hidden = true;
      $("login-area").hidden = false;
      showStatus("");
    }
    // Signed in: customers see only their own wallet (no persona buttons, no user picker); staff keep both.
    async function showWallet() {
      const isCustomer = me.role === "customer";
      $("login-area").hidden = true;
      $("session-row").hidden = false;
      $("personas").hidden = isCustomer;
      $("user-field").hidden = isCustomer;
      $("admin-link").hidden = isCustomer;
      $("customer-actions").hidden = !isCustomer;
      // A linked customer without a current consent sees the data notice first, and nothing else.
      const needsConsent = me.consent && me.consent.required && !me.consent.given;
      $("consent-area").hidden = !needsConsent;
      $("wallet-area").hidden = needsConsent;
      applyStrings();
      if (needsConsent) { resetSections(); return; }
      if (!$("user-select").options.length && !(await loadUsers())) return;
      applyStrings();
      loadForecast();
      loadSummary();
      loadBudgets();
    }
    // Asks the server who is signed in (the session cookie is HttpOnly, so the page cannot read it).
    async function loadMe() {
      try {
        const response = await fetch("/auth/me");
        me = response.ok ? await response.json() : null;
      } catch (_e) { me = null; }
      return me;
    }
    $("login-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const username = $("login-user").value.trim(), password = $("login-pass").value;
      if (!username || !password) { $("login-msg").textContent = S().signInMissing; return; }
      $("login-msg").textContent = "";
      try {
        const response = await fetch("/auth/login", { method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password }) });
        if (!response.ok) { $("login-msg").textContent = await errorMessage(response); return; }
        me = await response.json();
      } catch (_e) { $("login-msg").textContent = S().errorFallback; return; }
      $("login-pass").value = "";                              // Never keep the password in the page.
      showWallet();
    });
    $("logout-btn").addEventListener("click", async () => {
      try {
        await fetch("/auth/logout", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" });
      } catch (_e) { /* Signed out locally either way. */ }
      showSignedOut();
    });

    // SECTION: start-up. Build the month list and what-if fields, label everything, then ask who is signed in.
    (async function start() {
      buildMonths();
      buildWhatifFields();
      buildLiveForm();
      $("results-note").textContent = STRINGS.results.note;
      applyStrings();
      if (await loadMe()) showWallet(); else showSignedOut();
    })();
  </script>
</body>
</html>
